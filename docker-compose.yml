services:
  payload:
    container_name: youclickyoucollect
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    networks:
      - web-network
    volumes:
      - ./media:/app/media

networks:
  web-network:
    external: true
